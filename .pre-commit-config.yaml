# spike/fixtures/ are byte-exact recordings of perplexity.ai's wire format -- the SSE
# parser is tested against them, and a "fixed" trailing newline changes what they prove.
exclude: "^spike/fixtures/"

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-ast
    -   id: check-json
    -   id: check-merge-conflict
    -   id: detect-private-key

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
    -   id: ruff
        args: [--fix]
        exclude: "^spike/"
    -   id: ruff-format
        exclude: "^spike/"

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
    -   id: mypy
        exclude: "^(tests|spike)/"
        args: ["--strict", "--warn-unreachable", "--ignore-missing-imports"]
        additional_dependencies: ["playwright>=1.49,<2"]

-   repo: local
    hooks:
    -   id: pytest
        name: pytest
        entry: uv run pytest tests/ -q
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]

-   repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
    -   id: commitizen
        stages: [commit-msg]
