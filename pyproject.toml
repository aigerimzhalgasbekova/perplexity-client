[project]
name = "perplexity-client"
version = "0.1.0"
description = "Automate your own Perplexity Pro account from Python and the shell."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    # Attach-only: Playwright never launches the browser (docs/M0-findings.md).
    # Upper-bounded because a CDP behaviour change here breaks the whole tool.
    "playwright>=1.49,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pplx = "perplexity_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perplexity_client"]
